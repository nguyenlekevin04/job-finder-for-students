<html><head><script type="application/ld+json">{"@context": "https://schema.org", "@type": "JobPosting", "title": "Praktikant AI & Data Engineering (m/w/d)", "description": "Du willst im Bereich Consulting – Artificial Intelligence and Data Kunden helfen, strategische Entscheidungen zu AI & Data zu treffen? Unser Team unterstützt von der Definition der AI & Data-Strategie über die Implementierung groß angelegter Datenplattformen und Visual Analytics Programme bis hin zu Einführung smarter \"Age of With\"-Lösungen. Sichere unseren gemeinsamen Erfolg und mach mit uns den Unterschied: als Praktikant AI & Data Engineering (m/w/d). Standorte: Berlin, Düsseldorf, Frankfurt (Main), Hamburg, Hannover, Köln, München und Stuttgart. ## Dein Impact: Als Praktikant AI & Data Engineering (m/w/d) arbeitest du direkt an einer Lösung, die beim Kunden im Einsatz ist: einer Cloud-Datenplattform mit AI-gestützter Dokumentenverarbeitung und einer Web-Applikation, mit der Fachbereiche ihre täglichen Entscheidungen treffen. - Entwicklung: Du baust mit uns Features entlang des gesamten Stacks – Datenverarbeitung in Python und SQL, Web-Applikationen (z. B. Flask/Streamlit) und AI-Komponenten wie LLM- und OCR-basierte Automatisierung. - Verantwortung: Du übernimmst eigene Aufgabenpakete – vom Verständnis der fachlichen Anforderung über die Umsetzung bis zum Test und zur Übergabe an den Kunden. - Kundennähe: Du bist bei Terminen mit dem Fachbereich dabei, nimmst Anforderungen auf, zeigst Zwischenstände und übersetzt Feedback in konkrete Verbesserungen. - AI-Driven Development: Du arbeitest von Tag eins mit AI-Coding-Assistenten (z. B. GitHub Copilot) und hilfst uns, diese Arbeitsweise im Projekt weiterzuentwickeln. - Cloud & IaaS: Du bekommst praktischen Einblick in eine moderne Cloud-Datenarchitektur (AWS: S3, Glue, Athena, Lambda) und lernst, wie Infrastruktur bereitgestellt, betrieben und weiterentwickelt wird. ## Dein Skillset: - Fortgeschrittenes Studium in (Wirtschafts-)Informatik, Data Science, (Wirtschafts-)Ingenieurwesen,Statistik, Naturwissenschaften oder in vergleichbaren Studiengängen - Solide Python-Grundlagen und erste SQL-Kenntnisse aus Studium, Praktika, Werkstudententätigkeiten oder eigenen Projekten - Erste Berührungspunkte mit Web-Applikationen (z. B. Flask, Streamlit, FastAPI) oder Lust, dich hier schnell einzuarbeiten - Interesse an AI-gestützter Softwareentwicklung und ein Grundverständnis von Cloud-Konzepten (IaaS, Storage, Compute; Vorerfahrung mit AWS, Azure oder GCP ist ein Plus, aber keine Voraussetzung) - Reisebereitschaft sowie Deutsch (C1) und Englisch sehr gut in Wort und Schrift ## Deine Chance: - Echte Verantwortung für eigene Aufgabenpakete innerhalb unserer Projekte, die du selbständig bearbeitest - Persönliche:r Mentor:in in deinem Team, der/die dir mit Rat und Tat zur Seite steht und dich mit umfassendem Know-how unterstützt - Ein chancenreiches und internationales Umfeld, das dir einmalige Einblicke in die Arbeit des weltweit größten Prüfungs- und Beratungsunternehmens bietet - Work-Life-Balance in einem innovativen Unternehmensumfeld, das dir Gesundheitstage, Mitarbeiter:innen-Events und vieles mehr bietet - Bereichsübergreifendes Networking im Deloitte Student Network mit exklusiven Vorträgen und regelmäßigem Austausch beim Praktikant:innen-Stammtisch - Vielfältige Gestaltungsspielräume und aktive Förderung einer inklusiven Unternehmenskultur – u. a. durch unsere Diversity & Inclusion Mitarbeiter:innen-Netzwerke ## Deine Verfügbarkeit: Als Praktikant:in bist du ab Oktober 2026 idealerweise für einen Zeitraum von mindestens vier Monaten verfügbar. ## Bist du bereit? Mach mit uns den Unterschied! Unser Recruiting-Team freut sich auf deine Bewerbungsunterlagen (CV sowie Abitur-, Hochschul- und Arbeitszeugnisse) über unser Online-Formular. Ein Anschreiben und ein Bewerbungsfoto sind bei uns nicht erforderlich. Gleiche Chancen für alle: Wir freuen uns über Bewerbungen von Menschen, die so vielfältig sind wie wir – unab jetzt mit KI die nächste Aufgabe erledigen können. Und insgesamt wurde das sehr, sehr gut angenommen . Das ist ein sehr belohnendes Projekt. Wir hatten zum Beispiel neulich den Austausch dann mit Kolleg :innen aus Singapur, die dort entsprechend für eine Bank einen generativen KI-Assistenten einführen wollten und dann von unseren Erfahrungen profitieren wollten. Und innerhalb von unserer Abteilung haben wir sehr viele Kolleg :innen , die schon lange dabei sind. Das macht tatsächlich Deloitte auch teilweise aus, und deswegen hat man sehr viele Kolleg :innen , die wirklich gut verstehen, wie die Arbeit funktioniert - innerhalb der Abteilung, aber auch mit den Kund en zusammen. Also wir haben sehr, sehr viele Kolleg :innen mit sehr interessanten Hintergründen . N atürlich auf der einen Seite die klassischen KI- und Machine -Learning-Engineers , sehr viel, aber auch mit einem Data - Engineerin g- Hintergrund oder sogar - wie ich jetzt zum Beispiel - mit dem Software - Engineerin g- Hintergrund. Wir haben teilweise aber auch Kolleg :innen , die haben irgendwann mal Geschichte studiert, dann entsprechend obendrauf noch mal Weiterbildungen gemacht also eigentlich egal, mit welchem Hintergrund man angefangen hat - und das ist auch eine Geschichte, die ich extrem zu schätzen gelernt habe bei Deloitte : d ass man wirklich die Möglichkeiten hat, sehr viel für sich zu erkunden und dann sich aber auch zu vertiefen und wirklich Exper t:in in einem Gebiet zu werden."}, "description": "Wie wird generative KI in Unternehmen eingesetzt? Paul aus AI & Data bei Deloitte gibt Einblicke in KI-Projekte und internationale Zusammenarbeit."}, {"@type": "VideoObject", "name": "YouTube Short von Deloitte Deutschland", "description": "YouTube Short von Deloitte Deutschland", "thumbnailUrl": "https://i.ytimg.com/vi/JuilW4b8dWo/hqdefault.jpg", "embedUrl": "https://www.youtube.com/embed/JuilW4b8dWo", "uploadDate": "2026-10-16T13:06:15.248449+00:00", "transcript": "Szene 1 – Vorstellung [00:00:00–00:00:10] [Visuell]: Jonathan und Andreas sitzen nebeneinander auf einem grünen Sofa und sprechen abwechselnd direkt in die Kamera. Hinter ihnen befinden sich große Fenster, durch die eine Dachterrasse und einfallendes Sonnenlicht zu sehen sind. Vor dem Sofa steht ein kleiner, runder Tisch mit einem Laptop. [Texteinblendung]: „AI & Data @ Deloitte – Why I joined, Why I stayed“ Jonathan: „Hi, ich bin Jonathan und vor zwei Jahren bei AI & Data eingestiegen.“ Andreas: „Ich bin Andreas und auch vor zwei Jahren bei AI & Data eingestiegen.“ Jonathan: „Why I joined.“ Andreas: „Why I stayed.“ Szene 2 – Why I joined [00:00:10–00:00:34] [Visuell]: Jonathan sitzt weiterhin auf dem grünen Sofa. Die Kamera zeigt nun ausschließlich ihn, während er direkt in die Kamera spricht. Im Hintergrund sind die großen Fenster und die Dachterrasse zu sehen. Jonathan: „Ich wollte nicht nur über KI reden, sondern auch bei echten Unternehmen umsetzen. Bei AI & Data begleiten wir unsere Kunden von der Datenstrategie bis hin zur Plattform bis hin zu den Modellen, die in Produktion laufen. Und genau diese Bandbreite hat mich gereizt. Ich habe erwartet, viel zu lernen – was auch stimmt: Data Engineering, Data Governance und GenAI. Was ich nicht erwartet habe: Wie viel Verantwortung man direkt in den ersten Monaten bekommt. Nach ein paar Wochen saß ich schon beim Kunden – natürlich mit einem Team im Rücken, was einen da nicht alleine lässt.“ Szene 3 – Why I stayed [00:00:34–00:01:09] [Visuell]: Andreas sitzt an derselben Stelle auf dem grünen Sofa und spricht direkt in die Kamera. Jonathan ist nicht mehr im Bild zu sehen. Im Hintergrund befinden sich weiterhin die großen Fenster mit Blick auf die Dachterrasse. Andreas: „Mich fasziniert jeden Tag, wie sich unser Bereich und unsere tägliche Arbeit verändern und wir mit ihm. Vor einigen Jahren ging es noch überwiegend um Dashboards und Datenplattformen. Heute haben wir Themen wie GenAI, Agenten oder Intelligent Automation. Bei uns arbeiten wir an dem, was gerade entsteht – nicht an dem, was alle schon machen. Heute führe ich Projektteams über alle vier Bereiche: AI Strategy & Data Management, Data Engineering, AI Insights und Intelligent Automation – und sehe, wie Leute wie Jonathan darin wachsen. Das mitzugestalten macht mir einfach unfassbar Spaß.“ Szene 4 – Abschluss und Aufruf [00:01:09–00:01:16] [Visuell]: Jonathan und Andreas laufen gemeinsam durch einen hellen Flur auf die Kamera zu. Die Kamera bewegt sich mit ihnen, während sie abwechselnd direkt in die Kamera sprechen. Jonathan: „Ich bin gekommen, um KI-Projekte umzusetzen.“ Andreas: „Ich bleibe, weil es hier immer weitergeht.“ Jonathan: „Und du? Erfahre mehr über AI & Data bei Deloitte.“ Szene 5 – Bewerbungsaufruf [ab 00:01:16] [Visuell]: Schwarzer Hintergrund mit eingeblendeter Schrift. [Texteinblendung]: „Jetzt bewerben – AI & Data @ Deloitte“"}, {"@type": "Quotation", "text": "„Wir arbeiten eng über Standorte hinweg mit unseren länderübergreifenden Kolleg:innen, teilen Wissen schnell und treffen Entscheidungen effizient. Offene Unterstützung und ehrliches Feedback ermöglichen Wachstum und die kontinuierliche Weiterentwicklung des Teams.“", "creator": {"@type": "Person", "name": "Felix ", "jobTitle": "Consultant, AI & Data", "worksFor": {"@type": "Organization", "name": "Deloitte GmbH"}}}, {"@type": "VideoObject", "name": "YouTube Short von Deloitte Deutschland", "description": "YouTube Short von Deloitte Deutschland", "thumbnailUrl": "https://i.ytimg.com/vi/2BvF8N_tF7Y/hqdefault.jpg", "embedUrl": "https://www.youtube.com/embed/2BvF8N_tF7Y", "uploadDate": "2026-09-28T12:28:32.685510+00:00", "transcript": "Szene 1 – Einstieg [ca. 00:00:03–00:00:03] [Visuell]: Der Sprecher nimmt ein Smartphone in die Hand und spricht direkt in die Kamera. [Texteinblendung] : „POV: 3 Dinge über AI & Data bei Deloitte“ Sprecher: „AI & Data – drei Dinge, die meinen Job ausmachen !“ Szene 2 – Daten als Grundlage für KI [ca. 00:00:03–00:00:19 ] [Visuell]: Der Sprecher steht in einem Meetingraum und spricht direkt in die Kamera. Hinter ihm ist ein großer Bildschirm zu sehen . Sprecher: „Viele denken bei AI & Data direkt an KI-Modelle. Tatsächlich beschäftigen wir uns aber oft zuerst mit den Daten und den relevanten Schnittstellen . Wir analysieren die Datenlandschaft , entwickeln Datenstrategien und schaffen damit dann die Grundlage , um KI und Analytics zuverlässig einsetzen zu können .“ Szene 3 – Technische Fähigkeiten und Problemlösung [ ca. 00:00:19–00:00:33 ] [Visuell]: Der Sprecher sitzt auf einem Stuhl im Meetingraum und spricht direkt in die Kamera. Vor ihm steht ein Laptop auf dem Tisch. Sprecher: „ Technisch helfen Skills in Python, SQL und Cloud- Technologien . Tools sind nur die halbe Miete . Wir brauchen Skills, um komplexe Probleme zu lösen . Insbesondere Muster erkennen und Daten auswerten . Und genau diese Mischung macht den Job so spannend .“ Szene 4 – Technologie und Business verbinden [ ca. 00:00:33–00:00:46 ] [Visuell] : Der Sprecher läuft durch einen Flur auf die Kamera zu und spricht dabei direkt in die Kamera. Im Hintergrund sind verschiedene Büroräume zu sehen . Sprecher: „Mit zunehmender Erfahrung sinkt die Relevanz der Technologie. Es wird immer wichtiger , dass man die richtige Lösung für das Business findet und die Stakeholder abholt . Und genau diese Kombination aus technischer Tiefe und Strategischem macht den Job so interessant .“ Szene 5 – Call-to-Action [ ca. 00:00:46–00:00:50 ] [Visuell]: Der Sprecher steht erneut im Meetingraum und spricht direkt in die Kamera. Sprecher: „ Bereit , Daten , Technologie und Business zusammenzubringen ?“ Szene 6 – Abschluss ab [ ca. 00:00:50 ] [Visuell]: Schwarzer Hintergrund . [Texteinblendung] : „ Jetzt bewerben “ Sprecher: „ Entdecke jetzt unsere AI & Data Jobs.“"}]}</script></head><body><h1>x</h1></body></html>
