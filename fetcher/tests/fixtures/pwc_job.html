<html><script>phApp.ddo = {"jobDetail": {"data": {"job": {"jobId": "1527", "title": "Praktikant / Werkstudent im Bereich IT-Transformation/CIO Advisory (w/m/d)", "description": "<p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\"><span xml:lang=\"DE-DE\" data-contrast=\"auto\">Für unseren Geschäftsbereich </span><strong><a href=\"https://jobs.pwc.de/de/de/consulting-solutions\" target=\"_blank\" rel=\"noreferrer noopener\"><span data-ccp-charstyle=\"Hyperlink\">Consulting</span></a></strong><span xml:lang=\"DE-DE\" data-contrast=\"auto\"> suchen wir dich</span> zum <strong>nächstmöglichen Zeitpunkt </strong>als <strong>Praktikant / Werkstudent im Bereich IT-Transformation/CIO Advisory (w/m/d).</strong></span></p><p> </p><p><span style=\"font-size: 14.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Das erwartet dich</strong></span></p><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><strong>Beratung </strong>– Als vollwertiges Mitglied unseres Teams im Bereich CIO Advisory unterstützt du bei der Beratung führender Unternehmen von der Strategie bis zur Umsetzung. Du wirst ins Tagesgeschäft eingebunden und trägst so deinen Anteil zum Projekterfolg bei.</span></div><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><strong>Projekte</strong> – Durch vielfältige und anspruchsvolle IT-Projekte im Industrie- und Dienstleistungsbereich lernst du unterschiedlichste Themen innerhalb einer Technologietransformation kennen. Das Leistungsspektrum umfasst u.a. strategische Themen wie der Entwurf von IT- und Digitalstrategien, Enterprise Architecture und Sourcing/Shoring Konzepte. Dabei erhältst du eigenständige Aufgaben, deckst Effizienzpotenziale auf und wirkst in weitreichenden Projektentscheidungen unterstützend mit.</span></div><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><strong>Problemlösung</strong> – Gemeinsam im interdisziplinären Team und mit Berater:innen von PwC erarbeitest du nachhaltige und effiziente Lösungen im Spannungsfeld komplexer IT-Transformationen bei unseren Kunden. Zudem hast du die Möglichkeit, je nach Interessensgebiet, dein Wissen zu vertiefen, spannende Themen voranzutreiben und dich im Business Development zu engagieren.</span></div><p> </p><p><span style=\"font-size: 14.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Das bringst du mit</strong></span></p><ul><li style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\">Du studierst (Wirtschafts-) Informatik, Wirtschaftsingenieurwesen oder Betriebswirtschaft oder einen vergleichbaren Studiengang und hast mindestens das dritte Fachsemester abgeschlossen</span></div></li><li style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\">Du bringst erste Praxiserfahrungen in Unternehmensberatungen und/oder Unternehmen aus der Industrie mit.</span></div></li><li style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\">Du interessierst dich für die digitale Transformation von Unternehmen und begeisterst dich für komplexe Fragestellungen im Kontext des IT Managements.</span></div></li><li style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\">Du verfügst über routinierte Kenntnisse in den MS-Office Anwendungen, insbesondere in PowerPoint, und kannst diese zur Erstellung überzeugender Präsentationen nutzen.</span></div></li><li style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\">Du arbeitest analytisch und strukturiert. Du bist in der Lage, komplexe Zusammenhänge schnell zu erfassen und lebst Teamarbeit aktiv, indem du deine Erkenntnisse klar und verständlich teilst.</span></div></li><li style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\"><div><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12.0pt;\">Du verfügst über sehr gute Deutsch- und Englischkenntnisse in Wort und Schrift.</span></div></li></ul><p> </p><p><span style=\"font-size: 14.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Deine Benefits</strong></span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Kultur</strong> – Wir möchten, dass du dich bei uns wohl fühlst. Deshalb pflegen wir eine offene und moderne Unternehmens- sowie Führungskultur, in der wir geleistete Arbeit gemeinsam anerkennen und feiern. .</span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Flexibilität</strong> – In Abstimmung mit deinem Team erwartet dich ein Mix aus gemeinsamen Bürotagen und Home Office. Dabei gibt es keine Kernarbeitszeiten – im Rahmen der betrieblichen Anforderungen und arbeitsrechtlichen Vorgaben kannst du deine Arbeitszeit flexibel gestalten. Zusätzlich hast du die Möglichkeit, temporär in über 40 Ländern zu arbeiten. </span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Masterförderung</strong> – Durch unsere interne Academy, internationale Erfahrungen durch Secondments und kontinuierliches Mentoring entwickelst du dich stetig weiter. Darüber hinaus bieten wir die Möglichkeit einer Masterförderung für Examensmaster und Spezialisierungsmaster an.</span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\"><strong>KiT</strong> – Mit unserem Programm \"Keep in Touch\" (KiT) bleiben wir auch nach Praktikumsende mit unseren Praktikant:innen und Werkstudierenden in Kontakt und bieten dir viele Vorteile, wie z.B. exklusive Einladungen zu Seminaren und Workshops sowie umfangreiche Informationen zu den Einstiegsmöglichkeiten. </span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Das ist noch nicht alles</strong> – Wir möchten ein positives Arbeitsumfeld schaffen: Ein Umfeld, in dem flexibles und kreatives Arbeiten möglich ist, in dem Arbeit anerkannt und Leistung honoriert wird und auf das wir stolz sind. Alle Benefits findest du auf unserer Karriereseite.</span></p><p> </p><p> </p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\">Bei PwC Deutschland arbeiten wir daran, entscheidende Herausforderungen zu lösen, nachhaltige Ergebnisse zu schaffen und das Vertrauen in die Wirtschaft und Gesellschaft auszubauen. Als Teil unseres Teams hilfst du Organisationen dabei, sowohl ihre Arbeit als auch ihre Arbeitsweise grundlegend zu verändern, um ihren Platz in der Zukunft zu sichern. So kombinieren wir Einfallsreichtum, Erfahrung und technologische Innovation, um nachhaltige Ergebnisse zu erzielen und Vertrauen aufzubauen. Mit dir gemeinsam bieten wir unseren Kunden maßgeschneiderte Lösungen über die gesamte Wertschöpfungskette hinweg - vom Back- und Middle-Office (z.B. Finanzen, Supply Chain Management) bis zum Front-Office (Produkt- und Kundentransformation).</span></p><p> </p><p><span style=\"font-size: 14.0pt; font-family: arial, helvetica, sans-serif;\"><strong>Kontakt</strong></span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\">Du hast Fragen zu dieser Position oder deiner Bewerbung?</span></p><p><span style=\"font-size: 12.0pt; font-family: arial, helvetica, sans-serif;\">Melde dich gerne bei <strong>uns</strong> unter <strong>+49 69 9585-2222.</strong></span></p><br>", "postedDate": "2026-04-21T00:00:00.000+0000", "multi_location": [{"country": "DEU", "cityState": "Berlin", "zipCode": "", "address": "Berlin, DEU", "city": "Berlin", "address1": "Berlin, DEU", "postalCode": "", "latlong": {"
