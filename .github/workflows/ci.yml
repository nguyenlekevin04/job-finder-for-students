name: CI

# Checks every pull request and every push to the deploy branches.
# `main` is protected: it only accepts pull requests whose checks passed.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetcher:
    name: Fetcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.lock
      - run: pip install --require-hashes -r fetcher/requirements.lock
      - run: python -m pytest fetcher/tests -q

  web:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # same as the Vercel project setting
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps/PageProps are generated types; create them without a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Without Supabase env vars the build reads jobs.json; that's fine for checking it compiles.
      - run: npm run build
