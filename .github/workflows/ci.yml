name: CI

# Checks every pull request and every push to the deploy branches.
# `main` is protected: it only accepts pull requests whose checks passed.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetcher:
    name: Fetcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.lock
      - run: pip install --require-hashes -r fetcher/requirements.lock
      - run: python -m pytest fetcher/tests -q
      # Known vulnerabilities in the locked Python dependencies (PyPI advisory database).
      - run: pip install pip-audit==2.9.0 && pip-audit -r fetcher/requirements.lock --require-hashes --disable-pip

  web:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # same as the Vercel project setting
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps/PageProps are generated types; create them without a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Browser smoke tests (Playwright). test:e2e builds the static export itself (with fixture
      # data and no Supabase env), so it also checks that the site compiles.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
