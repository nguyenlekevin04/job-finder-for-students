name: CI

# Checks every pull request and every push to the deploy branches.
# `main` is protected: it only accepts pull requests whose checks passed.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetcher:
    name: Fetcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt
      - run: pip install -r fetcher/requirements.txt
      - run: python -m pytest fetcher/tests -q

  web:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the Vercel project setting
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # LayoutProps/PageProps are generated types; create them without a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Browser smoke tests (Playwright). test:e2e builds the static export itself (with fixture
      # data and no Supabase env), so it also checks that the site compiles.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
