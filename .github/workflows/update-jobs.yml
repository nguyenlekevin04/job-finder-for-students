name: Update jobs

on:
  schedule:
    - cron: "0 5 * * *" # daily, 06:00 Berlin in winter / 07:00 in summer
  workflow_dispatch: # "Run workflow" button in the Actions tab
    inputs:
      accept_removals:
        description: "Source names whose large removal you approve for this run, comma-separated (e.g. HZDR)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Production only (2026-11-17): the team ships straight to production, so no staging copy.
  fetch:
    name: Fetch (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: update-jobs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.lock

      # Every package, transitive ones included, is pinned and hash-checked.
      - name: Install fetcher dependencies
        run: pip install --require-hashes -r fetcher/requirements.lock

      - name: Test fetcher
        run: python -m pytest fetcher/tests -q

      - name: Fetch jobs into the production database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PRODUCTION_WRITE: "1"
          ACCEPT_REMOVALS: ${{ inputs.accept_removals }}
          # Signs the job alerts (web push); production only, so staging never notifies anyone.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python fetcher/main.py --require-db
