name: Update jobs

on:
  schedule:
    - cron: "0 5 * * *" # daily, 06:00 Berlin in winter / 07:00 in summer
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["fetcher/**", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - name: Install fetcher dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Test fetcher
        run: python -m pytest fetcher/tests -q

      # Pushes only run the tests; the daily schedule and the manual button
      # fetch jobs and write them to Supabase.
      - name: Fetch jobs into Supabase
        if: github.event_name != 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetcher/main.py --require-db
