name: Update jobs

on:
  schedule:
    - cron: "0 5 * * *" # daily, 06:00 Berlin in winter / 07:00 in summer
  workflow_dispatch: # "Run workflow" button in the Actions tab
    inputs:
      target:
        description: Which database to update
        type: choice
        options: [production, staging]
        default: production
      accept_removals:
        description: "Source names whose large removal you approve for this run, comma-separated (e.g. HZDR)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fetch:
    # The schedule updates both databases (it also keeps the free staging project
    # from pausing); the button updates the one you pick.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["production","staging"]') }}
    name: Fetch (${{ matrix.target }})
    runs-on: ubuntu-latest
    concurrency:
      group: update-jobs-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - name: Install fetcher dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Test fetcher
        run: python -m pytest fetcher/tests -q

      # Separate secret names per database, and no fallback between them: a missing
      # staging secret must fail the run, never write staging data to production.
      - name: Fetch jobs into the production database
        if: matrix.target == 'production'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PRODUCTION_WRITE: "1"
          ACCEPT_REMOVALS: ${{ inputs.accept_removals }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetcher/main.py --require-db

      - name: Fetch jobs into the staging database
        if: matrix.target == 'staging'
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          ACCEPT_REMOVALS: ${{ inputs.accept_removals }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetcher/main.py --require-db
