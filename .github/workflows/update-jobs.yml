name: Update jobs & deploy

on:
  schedule:
    - cron: "0 5 * * *" # daily, 06:00 Berlin in winter / 07:00 in summer
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["web/**", "fetcher/**", ".github/workflows/**"]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed jobs.json
      pages: read # configure-pages reads the Pages site for base_path
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - name: Install fetcher dependencies
        run: pip install -r fetcher/requirements.txt

      - name: Test fetcher
        run: python -m pytest fetcher/tests -q

      - name: Fetch jobs
        # If every source fails, keep yesterday's data and still deploy.
        continue-on-error: true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetcher/main.py

      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to jobs.json"
          else
            git commit -m "Update jobs ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        working-directory: web
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
